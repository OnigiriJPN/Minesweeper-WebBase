<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マインスイーパー - Select OS</title>
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <style>
    body {
      background-color: #008080;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: "Tahoma", sans-serif;
    }
    .os-card {
      background: #c0c0c0;
      border: 2px solid #fff;
      padding: 15px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="window" style="width: 320px;">
    <div class="title-bar">
      <div class="title-bar-text">Boot Menu - Classic Mine</div>
    </div>
    <div class="window-body">
      <p style="margin-top: 0;">遊ぶバージョン（OS）を選択してください：</p>
      
      <div class="os-card">
        <div>
          <strong>Windows 98 Edition</strong><br>
          <small>無骨で硬派な初代UI</small>
        </div>
        <button onclick="location.href='win98.html'">起動</button>
      </div>

      <div class="os-card">
        <div>
          <strong>Windows XP Edition</strong><br>
          <small>鮮やかな青と緑のUI</small>
        </div>
        <button onclick="location.href='winxp.html'">起動</button>
      </div>

      <div class="os-card">
        <div>
          <strong>Windows 7 Edition</strong><br>
          <small>透明感あふれるAero UI</small>
        </div>
        <button onclick="location.href='win7.html'">起動</button>
      </div>
    </div>
  </div>

</body>
</html>
